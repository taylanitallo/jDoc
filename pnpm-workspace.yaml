packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  argon2: true
  esbuild: true
  '@nestjs/core': true
  '@swc/core': true
  sharp: true
  msgpackr-extract: true
  electron: true
  keytar: true
  '@google/genai': true
  protobufjs: true

onlyBuiltDependencies:
  - argon2
  - esbuild
  - '@nestjs/core'
  - '@swc/core'
  - sharp
  - msgpackr-extract
  - electron
  - keytar
  - '@google/genai'
  - protobufjs

overrides:
  ioredis: ^5.11.1
